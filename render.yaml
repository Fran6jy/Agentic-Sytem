services:
  - type: web
    name: ai-math-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free,qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free
      - key: OPENAI_VISION_MODEL
        value: qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free
      - key: OPENROUTER_APP_NAME
        value: Chalk Lab AI Math Tutor
      - key: OPENROUTER_APP_URL
        value: https://chalklab.vercel.app
